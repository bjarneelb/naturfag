# Naturfagsiden
[build]
  publish = "."

# De felles filene ligger i fellesrepoet, og hentes derfra.
# Omskrivingen gjør at stiene i spillene fortsatt kan være ./js/...,
# og nettleseren ser filene som om de kom fra denne siden.
[[redirects]]
  from = "/js/*"
  to = "https://fellesting.netlify.app/js/:splat"
  status = 200
  force = true

